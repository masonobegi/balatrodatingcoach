<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Card Stack</title>
  <desc id="desc">Stylized stack of playing cards for Balatro themed visuals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121a33"/>
      <stop offset="100%" stop-color="#263563"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eeff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="690" cy="90" r="64" fill="#2ee4b7" opacity="0.18"/>
  <circle cx="120" cy="520" r="78" fill="#7c8bff" opacity="0.2"/>

  <g transform="translate(170 90)">
    <rect x="80" y="25" width="300" height="410" rx="20" fill="#d5defa" opacity="0.65" transform="rotate(-10 230 230)"/>
    <rect x="120" y="20" width="300" height="410" rx="20" fill="#dbe5ff" opacity="0.8" transform="rotate(8 270 225)"/>
    <rect x="105" y="35" width="320" height="430" rx="22" fill="url(#card)" stroke="#c6d2ff" stroke-width="6"/>

    <text x="130" y="90" font-size="52" font-family="Inter, Arial, sans-serif" fill="#d62f4b">A</text>
    <path d="M350 110c22-34 68-16 68 19 0 24-16 40-42 64l-38 34-39-34c-24-23-41-39-41-64 0-35 45-53 67-19 11 16 14 21 25 35 11-14 14-19 25-35z" fill="#d62f4b"/>
    <text x="370" y="425" font-size="52" font-family="Inter, Arial, sans-serif" fill="#d62f4b" transform="rotate(180 370 425)">A</text>

    <rect x="150" y="170" width="230" height="165" rx="16" fill="#7c8bff" opacity="0.18"/>
    <text x="265" y="270" text-anchor="middle" font-size="44" font-weight="700" font-family="Inter, Arial, sans-serif" fill="#2d3f8c">BALATRO</text>
  </g>
</svg>